[build]
  base    = "site"
  command = "npm run build"
  # relative to base, so this resolves to site/dist
  publish = "dist"

# Pinned for reproducible builds. Vite 8 needs Node ^20.19 || >=22.12,
# and pinning keeps CI from drifting off a version we've verified.
[build.environment]
  NODE_VERSION = "22"

# Also relative to base, so this is site/netlify/functions
[functions]
  directory = "netlify/functions"
  # The programme PDF is bundled into the function but deliberately kept out of
  # the published site, so the only way to obtain it is to have it emailed.
  included_files = ["private/**"]
