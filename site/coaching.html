              <option value="중급">중급 · Intermediate</option>
              <option value="고급">고급 · Advanced</option>
            </select>
          </div>
          <div class="field full">
            <label for="f-race">목표 대회 / 날짜 <span>Target race</span></label>

        <div class="btn-row" style="margin-top:28px">
