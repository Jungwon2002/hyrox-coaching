<svg viewBox="0 0 280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="선수 벤치마크 분석과 예상 하이록스 기록을 보여주는 앱 화면 예시">
  <defs>
    <clipPath id="screen-clip-1">
      <rect x="6" y="6" width="268" height="388" rx="24"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="280" height="400" rx="30" fill="#101210"/>

  <g clip-path="url(#screen-clip-1)">
    <rect x="6" y="6" width="268" height="388" fill="#F7F8F3"/>

    <!-- status bar -->
    <text x="26" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#101210">9:41</text>
    <rect x="233" y="26" width="19" height="9" rx="2.5" fill="none" stroke="#101210" stroke-width="1"/>
    <rect x="253" y="28.5" width="1.6" height="4" rx="0.8" fill="#101210"/>
    <rect x="236" y="28" width="13" height="5" rx="1.2" fill="#101210"/>

    <!-- header -->
    <text x="26" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#83887B">ASSESSMENT</text>
    <text x="26" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#101210">선수 분석</text>

    <line x1="26" y1="112" x2="254" y2="112" stroke="#E7E9E1" stroke-width="1"/>

    <!-- benchmark 1 -->
    <text x="26" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#43473F">10K 기록</text>
    <text x="254" y="140" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#101210">45:00</text>

    <line x1="26" y1="154" x2="254" y2="154" stroke="#E7E9E1" stroke-width="1"/>

    <!-- benchmark 2 -->
    <text x="26" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#43473F">백스쿼트 3RM</text>
    <text x="254" y="180" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#101210">120kg</text>

    <line x1="26" y1="194" x2="254" y2="194" stroke="#E7E9E1" stroke-width="1"/>

    <!-- estimate output -->
    <rect x="26" y="220" width="228" height="98" rx="14" fill="#101210"/>
    <text x="140" y="246" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#9AA093">예상 하이록스 완주 기록</text>
    <text x="140" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#FFE100">1:05:00–1:10:00</text>
    <text x="140" y="302" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="#83887B">프로 싱글 기준 추정치</text>
  </g>

  <rect x="1" y="1" width="278" height="398" rx="29" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
